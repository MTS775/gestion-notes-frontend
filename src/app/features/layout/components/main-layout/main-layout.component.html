<div class="main-layout" [class.sidebar-collapsed]="isCollapsed">

  <!-- Barre Mobile Header (visible uniquement sur petits écrans) -->
  <header class="mobile-header">
    <button class="mobile-menu-btn" (click)="sidebar.toggleMobileMenu()" aria-label="Ouvrir le menu">
      <i class="fa-solid fa-bars"></i>
    </button>
    <span class="mobile-brand">GEC Web</span>
  </header>

  <!-- Sidebar avec une référence de template (#sidebar) -->
  <app-sidebar #sidebar [config]="sidebarConfig" (toggleState)="onSidebarToggle($event)"></app-sidebar>

  <main class="main-content">
    <router-outlet></router-outlet>
  </main>
</div>
