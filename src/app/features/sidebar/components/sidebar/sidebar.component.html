<aside class="sidebar-container" [class.collapsed]="isCollapsed" [class.mobile-open]="mobileOpen">
  <!-- Sidebar Header / Logo -->
  <div class="sidebar-header">
    <div class="brand">
      <div class="logo-icon">
        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="currentColor">
          <path d="M12 3L1 9l11 6 9-4.91V17h2V9L12 3zM5 13.18v4l7 3.82 7-3.82v-4L12 17l-7-3.82z"/>
        </svg>
      </div>
      @if (!isCollapsed || isMobile) {
        <span class="brand-name">GEC Web</span>
      }
    </div>

    <!-- Toggle Button -->
    <button class="toggle-btn" (click)="toggleSidebar()" [attr.aria-label]="isMobile ? 'Fermer le menu' : (isCollapsed ? 'Déplier le menu' : 'Replier le menu')">
      @if (isMobile) {
        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="currentColor">
          <path d="M19 6.41L17.59 5 12 10.59 6.41 5 5 6.41 10.59 12 5 17.59 6.41 19 12 13.41 17.59 19 19 17.59 13.41 12z"/>
        </svg>
      } @else {
        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="currentColor" [class.rotated]="isCollapsed">
          <path d="M15.41 7.41L14 6l-6 6 6 6 1.41-1.41L10.83 12z"/>
        </svg>
      }
    </button>
  </div>

  <!-- Navigation Menu -->
  <nav class="sidebar-nav">
    <ul>
      @for (item of navItems; track item.id) {
        <li>
          <a
            [class.active]="item.isActive"
            (click)="selectItem(item)"
            [attr.title]="(isCollapsed && !isMobile) ? item.label : null"
          >
            <i class="nav-icon" [class]="item.icon"></i>
            @if (!isCollapsed || isMobile) {
              <span class="nav-label">{{ item.label }}</span>
            }
          </a>
        </li>
      }
    </ul>
  </nav>

  <!-- Logout Button -->
  <div class="sidebar-footer">
    <button class="logout-btn" (click)="onLogout()" [attr.title]="(isCollapsed && !isMobile) ? 'Se déconnecter' : null">
      <i class="nav-icon fa-solid fa-right-from-bracket"></i>
      @if (!isCollapsed || isMobile) {
        <span class="nav-label">Se déconnecter</span>
      }
    </button>
  </div>
</aside>

<!-- Mobile Backdrop -->
@if (isMobile && mobileOpen) {
  <div class="sidebar-backdrop" (click)="closeMobileSidebar()"></div>
}
