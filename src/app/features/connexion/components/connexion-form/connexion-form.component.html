<div class="login-container">
  <!-- Brand Header -->
  <div class="brand-header">
    <div class="logo-box">
      <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="currentColor">
        <path d="M19 3H5c-1.1 0-2 .9-2 2v14c0 1.1.9 2 2 2h14c1.1 0 2-.9 2-2V5c0-1.1-.9-2-2-2zm-9 14l-4-4 1.41-1.41L10 14.17l6.59-6.59L18 9l-8 8z"/>
      </svg>
    </div>
    <h1>Connexion</h1>
    <p>Bon retour ! Veuillez entrer vos identifiants.</p>
  </div>

  <!-- Form Card -->
  <div class="card">
    <form [formGroup]="loginForm" (ngSubmit)="onSubmit()">

      <!-- Email -->
      <div class="form-group">
        <label for="email">Adresse email</label>
        <input
          type="email"
          id="email"
          formControlName="email"
          placeholder="john@example.com"
          [class.invalid]="loginForm.get('email')?.touched && loginForm.get('email')?.invalid">
      </div>

      <!-- Password -->
      <div class="form-group">
        <div class="label-wrapper">
          <label for="password">Mot de passe</label>
          <a routerLink="/forgot-password" class="forgot-link">Mot de passe oublié ?</a>
        </div>
        <input
          type="password"
          id="password"
          formControlName="password"
          placeholder="Entrez votre mot de passe"
          [class.invalid]="loginForm.get('password')?.touched && loginForm.get('password')?.invalid">
      </div>

      <!-- Submit Button -->
      <button type="submit" [disabled]="loginForm.invalid" class="btn-primary">
        Se connecter
      </button>

      <!-- Footer Link -->
      <div class="footer-link">
        Vous n'avez pas de compte ? <a routerLink="/register">S'inscrire</a>
      </div>

    </form>
  </div>
</div>
